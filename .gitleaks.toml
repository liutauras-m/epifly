# Secret scanning: `gitleaks dir .` locally, and the `secrets` job in CI.
# Extends the default rules; the allowlist holds test fixtures only, never real values.
[extend]
useDefault = true

[allowlist]
description = "Generated keys and sample tokens in unit tests"
paths = [
  '''tools/epifly/tests/unit/secrets\.test\.ts''',
]
# Multi-line PEM fixtures cannot carry an inline `gitleaks:allow`; match their constant name.
regexTarget = "line"
regexes = [
  '''const TEST_RSA_PRIVATE_KEY''',
]
