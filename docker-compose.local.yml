# Local development: the managed services ConusAI Cloud links in production, run here
# as containers, plus host ports and plain-HTTP Zitadel on zitadel.localhost.
#   cp .env.example .env   # fill in the blanks
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Never deployed: ConusAI Cloud reads docker-compose.yml only.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: epifly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d epifly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:9.1.2-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
    volumes:
      - qdrant_data:/qdrant/storage

  rustfs:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: "${AWS_ACCESS_KEY_ID}"
      RUSTFS_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY}"
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - rustfs_data:/data
    ports: ["127.0.0.1:9000:9000"]

  gateway:
    environment:
      WEB_ORIGIN: http://localhost:3000
      ZITADEL_ISSUER: http://zitadel.localhost:8085
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      qdrant:
        condition: service_started
      rustfs:
        condition: service_started
    ports: ["127.0.0.1:8080:8080"]

  web:
    environment:
      ORIGIN: http://localhost:3000
      ZITADEL_ISSUER: http://zitadel.localhost:8085
    ports: ["127.0.0.1:3000:3000"]

  # One issuer for the browser and the containers: zitadel.localhost:8085. Browsers resolve
  # *.localhost to this machine (RFC 6761); inside the stack the network alias resolves it.
  zitadel:
    environment:
      ZITADEL_PORT: "8085"
      ZITADEL_EXTERNALDOMAIN: zitadel.localhost
      ZITADEL_EXTERNALPORT: "8085"
      ZITADEL_EXTERNALSECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases: [zitadel.localhost]
    ports: ["127.0.0.1:8085:8085"]

  lago-migrate:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lago-api:
    ports: ["127.0.0.1:3001:3000"]

volumes:
  postgres_data:
  qdrant_data:
  rustfs_data:
