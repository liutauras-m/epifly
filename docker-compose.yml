# epifly on ConusAI Cloud: one compose project.
#
# Stateful services are ConusAI Cloud managed services linked to the project; their
# variables are injected by the platform and interpolated below:
#   Postgres  POSTGRES_URL POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD
#   Redis     REDIS_URL
#   Qdrant    QDRANT_GRPC_URL QDRANT_API_KEY
#   S3        S3_BUCKET AWS_ENDPOINT_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
#   Platform  CONUSAI_API_URL CONUSAI_API_TOKEN (OTLP goes to the platform's /otel/v1)
# Everything else is a project variable; docs/deploy-conusai-cloud.md lists them all.
# Locally, docker-compose.local.yml adds those services: `just up`.
#
# Platform rules this file follows: no top-level x-* keys, no hostname/container_name,
# no host ports, no external volumes or networks, commands as lists, numeric non-root
# users, explicit resource limits. Services reach each other by service name.

services:
  gateway:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      WEB_ORIGIN: "https://${APP_DOMAIN}"
      QDRANT_GRPC_URL: "${QDRANT_GRPC_URL}"
      QDRANT_API_KEY: "${QDRANT_API_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      RUSTFS_IAM_ENC_KEY: "${RUSTFS_IAM_ENC_KEY}"
      ZITADEL_ISSUER: "https://auth.${APP_DOMAIN}"
      ZITADEL_AUDIENCE: "${ZITADEL_AUDIENCE}"
      PLATFORM_ADMIN_TOKEN: "${PLATFORM_ADMIN_TOKEN}"
      # Billing is on once LAGO_API_KEY is set; LAGO_WEBHOOK_SECRET is the organization's
      # HMAC key from Lago's UI (Developers -> Webhooks) and the webhook uses HMAC signing.
      LAGO_API_URL: http://lago-api:3000
      LAGO_API_KEY: "${LAGO_API_KEY}"
      LAGO_WEBHOOK_SECRET: "${LAGO_WEBHOOK_SECRET}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      CONUSAI_MCP_ALLOWED_HOSTS: current-time
      OTEL_SERVICE_NAME: epifly-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer%20${CONUSAI_API_TOKEN}"
      RUST_LOG: info,agent_gateway=info,tower_http=warn
    volumes:
      - gateway_data:/data
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      ORIGIN: "https://${APP_DOMAIN}"
      GATEWAY_URL: http://gateway:8080
      ZITADEL_ISSUER: "https://auth.${APP_DOMAIN}"
      ZITADEL_WEB_CLIENT_ID: "${ZITADEL_WEB_CLIENT_ID}"
      AUTH_SESSION_KEY: "${AUTH_SESSION_KEY}"
      BODY_SIZE_LIMIT: 100M
    expose: ["3000"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  current-time:
    build:
      context: services/current-time
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
      SERVICE_URL: http://current-time:8082
      PLATFORM_ADMIN_TOKEN: "${PLATFORM_ADMIN_TOKEN}"
    expose: ["8082"]
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  zitadel:
    # v4 with its built-in login (v1): Login v2 is a second container that needs a token
    # file shared through a volume, which a non-root compose service cannot set up here.
    # The managed Identity service will run Login v2 (conusai-cloud plan managed-identity-billing).
    image: ghcr.io/zitadel/zitadel:v4.19.5
    restart: unless-stopped
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "external"]
    environment:
      ZITADEL_MASTERKEY: "${ZITADEL_MASTERKEY}"
      ZITADEL_EXTERNALDOMAIN: "auth.${APP_DOMAIN}"
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: "${POSTGRES_HOST}"
      ZITADEL_DATABASE_POSTGRES_PORT: "${POSTGRES_PORT}"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${ZITADEL_DB_PASSWORD}"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "${POSTGRES_USER}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${POSTGRES_PASSWORD}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: epifly
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "${ZITADEL_ADMIN_USERNAME}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_ADMIN_PASSWORD}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  lago-migrate:
    image: getlago/api:v1.55.0
    restart: "no"
    command: ["./scripts/migrate.sh"]
    environment: &lago-env
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: "${POSTGRES_URL}"
      REDIS_URL: "${REDIS_URL}"
      LAGO_REDIS_CACHE_URL: "${REDIS_URL}"
      SECRET_KEY_BASE: "${LAGO_SECRET_KEY_BASE}"
      LAGO_ENCRYPTION_PRIMARY_KEY: "${LAGO_ENCRYPTION_PRIMARY_KEY}"
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: "${LAGO_ENCRYPTION_DETERMINISTIC_KEY}"
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: "${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}"
      LAGO_RSA_PRIVATE_KEY: "${LAGO_RSA_PRIVATE_KEY}"
      LAGO_API_URL: "https://billing.${APP_DOMAIN}"
      LAGO_FRONT_URL: "https://billing.${APP_DOMAIN}"
      LAGO_DISABLE_SIGNUP: "true"
      LAGO_SIDEKIQ_WEB: "false"
      LAGO_DISABLE_PDF_GENERATION: "true"
      LAGO_USE_AWS_S3: "false"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  lago-api:
    image: getlago/api:v1.55.0
    restart: unless-stopped
    command: ["./scripts/start.api.sh"]
    environment: *lago-env
    volumes:
      - lago_storage:/app/storage
    expose: ["3000"]
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  lago-worker:
    image: getlago/api:v1.55.0
    restart: unless-stopped
    command: ["./scripts/start.worker.sh"]
    environment: *lago-env
    volumes:
      - lago_storage:/app/storage
    depends_on:
      lago-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  lago-clock:
    image: getlago/api:v1.55.0
    restart: unless-stopped
    command: ["./scripts/start.clock.sh"]
    environment: *lago-env
    depends_on:
      lago-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  gateway_data:
  lago_storage:
