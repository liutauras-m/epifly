[workspace]
resolver = "3"
members = [
    "apps/backend/crates/common",
    "apps/backend/crates/rustfs-admin",
    "apps/backend/crates/agent-core",
    "apps/backend/crates/jobs",
    "apps/backend/crates/billing-core",
    "apps/backend/crates/agent-gateway",
    "apps/backend/evals",
    "apps/backend/xtask",
]
# The Tauri shell builds on its own (platform SDKs, webkit2gtk); it is not part
# of the backend workspace.
exclude = ["apps/browser-shell/src-tauri"]

[workspace.package]
version      = "0.3.1"
edition      = "2024"
rust-version = "1.99"
authors      = ["Liutauras Medziunas <info@conusai.com>"]
license      = "MIT"
repository   = "https://github.com/liutauras-m/epifly"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# AI / Rig
rig-core     = { version = "0.36" }

# Metadata store (redb embedded key-value)
redb         = { version = "2" }
postcard     = { version = "1", features = ["alloc"] }

# Vector DB (Qdrant)
qdrant-client = { version = "1", default-features = false, features = ["serde"] }

# HTTP
axum         = { version = "0.8", features = ["ws", "multipart"] }
reqwest      = { version = "0.13", features = ["json", "stream", "multipart", "form", "query"] }
tower        = { version = "0.5" }
tower-http   = { version = "0.6", features = ["cors", "trace", "compression-br", "fs"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1" }
toml         = { version = "0.8" }

# Error handling
thiserror    = { version = "2" }
anyhow       = { version = "1" }

# Tracing / Observability
tracing                    = { version = "0.1" }
tracing-subscriber         = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry              = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk          = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
# OTLP over HTTP/protobuf only (the platform ingest has no gRPC). The SDK's batch
# processors run on their own threads, so the blocking reqwest client is the
# supported pairing; TLS comes from the workspace reqwest (rustls).
opentelemetry-otlp         = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "0.33.1" }
opentelemetry-prometheus   = { version = "0.33.1" }
prometheus                 = { version = "0.14", features = ["process"] }
tracing-opentelemetry      = { version = "0.34.0" }

# WASM — sandboxed core modules (fuel + memory + epoch limits)
wasmtime     = { version = "49.0.3" }

# Auth / Crypto
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
sha2         = { version = "0.10" }
blake3       = { version = "1" }

# Schema / validation
schemars     = { version = "0.8", features = ["derive", "chrono"] }

# Base64
base64       = { version = "0.22" }

# Object / file storage (S3 — RustFS in dev, AWS S3 in prod)
object_store = { version = "0.11", features = ["aws"] }

# Encryption (AES-256-GCM for per-tenant credential storage)
aes-gcm = { version = "0.10" }

# RustFS admin body encryption (argon2id key derivation + AES-256-GCM)
argon2          = { version = "0.5", features = ["std"] }

# Local embeddings (optional, feature-gated in agent-core)
fastembed = { version = "5" }

# HMAC (for SigV4 / search helpers)
hmac         = { version = "0.12" }

# Stripe / Lago webhook signature verification
hex          = { version = "0.4" }

# Utilities
uuid         = { version = "1", features = ["v4", "v5", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
ulid         = { version = "1.1", features = ["serde"] }
bytes        = { version = "1" }
futures      = { version = "0.3" }
async-trait  = { version = "0.1" }
bon          = { version = "3" }

# Caching
moka         = { version = "0.12", features = ["future"] }

# indexmap for deterministic namespace index

# CLI args
clap         = { version = "4", features = ["derive"] }

# Scheduled jobs
tokio-cron-scheduler = { version = "0.13" }

# Colored output
colored      = { version = "2" }

# Glob patterns
glob         = { version = "0.3" }

# Filesystem watching (hot-reload of capability manifests)
notify       = { version = "7", features = ["macos_fsevent"] }


# OpenAPI documentation
utoipa       = { version = "5", features = ["axum_extras", "chrono", "uuid", "ulid"] }

# Test utilities
proptest     = { version = "1" }
wiremock     = { version = "0.6" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = true
