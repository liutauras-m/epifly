[package]
name    = "browser-shell"
version = "0.4.0"
edition = "2024"

# Built on its own (platform SDKs, webkit2gtk) — excluded from the backend
# workspace, so every dependency carries its own version here.

[lib]
name             = "browser_shell_lib"
crate-type       = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "browser-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                   = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog     = "2"
tauri-plugin-haptics    = "2"
# Used from Rust only (refresh-token vault with the argon2 KDF); its JS
# commands are not registered.
tauri-plugin-stronghold = { version = "2.4", features = ["kdf"] }
iota_stronghold         = "2.1"

common    = { path = "../../backend/crates/common" }

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
ulid         = { version = "1.1", features = ["serde"] }
chrono       = { version = "0.4", features = ["serde"] }
anyhow       = "1"
reqwest      = { version = "0.13.5", features = ["json", "stream", "multipart", "form"] }
base64       = "0.22"
futures-util = "0.3"
open         = "5.4"
sha2         = "0.10"
rand         = "0.8"

# WebDriver automation for E2E tests — debug builds only, gated by feature.
# Crate by danielraffel; adds a W3C WebDriver server to drive WKWebView on macOS.
[target.'cfg(all(debug_assertions, target_os = "macos"))'.dependencies]
tauri-plugin-webdriver-automation = { version = "0.1.3", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
updater         = ["tauri-plugin-updater"]
# e2e enables the macOS WebDriver automation server for integration testing.
# Only effective in debug builds on macOS.
e2e             = ["dep:tauri-plugin-webdriver-automation"]
